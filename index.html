<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkateCart Creator</title>
<style>
body{margin:0;font-family:Arial;background:#f5f7f9;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#fff;width:92%;max-width:420px;padding:24px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.1);margin:20px 0}
h2{margin:0;color:#1a2a3a} .sub{color:#6b7a8d;font-size:14px;margin:6px 0 18px}
label{font-size:13px;font-weight:bold} 
input{width:100%;border:none;border-bottom:1.5px solid #d0d7e0;padding:12px 0;margin:8px 0 18px;outline:none;font-size:15px;box-sizing:border-box}
.btn{width:100%;background:#0d9488;color:#fff;border:none;padding:14px;border-radius:10px;font-weight:bold;cursor:pointer}
.bottom{margin-top:18px;font-size:14px;text-align:center} .bottom a{color:#0d9488;font-weight:bold;text-decoration:none}
.hidden{display:none}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:15px 0}
.stat{background:#f0fdfa;padding:12px;border-radius:10px;text-align:center;border:1px solid #ccfbf1}
.stat b{display:block;font-size:20px;color:#0d9488} .stat span{font-size:12px;color:#555}
.cat{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.cat button{padding:8px 14px;border-radius:20px;border:1px solid #0d9488;background:#fff;color:#0d9488;font-size:13px;cursor:pointer}
.cat button.active{background:#0d9488;color:#fff}
</style>
</head>
<body>
<div id="signupBox" class="card">
<h2>Create Creator Account</h2><p class="sub">Join SkateCart and start earning</p>
<label>Full Name</label><input id="sName" placeholder="Enter your name">
<label>Email address</label><input id="sEmail" placeholder="Enter your Gmail">
<label>Password</label><input id="sPass" type="password" placeholder="Create password">
<label>Facebook Group Link</label><input id="sGroup" placeholder="https://facebook.com/groups/...">
<button class="btn" onclick="doSignup()">Create Account & Get Approved</button>
<div class="bottom">Already have account? <a href="#" onclick="showLogin()">Sign in</a></div>
</div>
<div id="loginBox" class="card hidden">
<h2>Welcome back</h2><p class="sub">Sign in to your creator account</p>
<label>Email</label><input id="lEmail" placeholder="Enter your email">
<label>Password</label><input id="lPass" type="password" placeholder="Enter your password">
<button class="btn" onclick="doLogin()">Sign in</button>
<div class="bottom">Need access? <a href="#" onclick="showSignup()">Create account</a></div>
<p id="lMsg" style="color:red;text-align:center"></p>
</div>
<div id="dashBox" class="card hidden">
<h2>Dashboard 🛹</h2><p class="sub">Welcome <b id="dName"></b></p>
<div class="stats">
<div class="stat"><b id="cClick">0</b><span>Clicks</span></div>
<div class="stat"><b id="cEarn">$0</b><span>Earning</span></div>
<div class="stat"><b id="cProd">0</b><span>Products</span></div>
</div>
<label>Select Category</label>
<div class="cat" id="catBox">
<button class="active" onclick="setCat(this,'Toys')">Toys</button>
<button onclick="setCat(this,'Home')">Home</button>
<button onclick="setCat(this,'Kitchen')">Kitchen</button>
<button onclick="setCat(this,'Beauty')">Beauty</button>
<button onclick="setCat(this,'Electronics')">Electronics</button>
</div>
<label>Walmart Product Link</label>
<input id="wLink" placeholder="Paste Walmart Link here">
<button class="btn" onclick="makeLink()">Create My Link</button>
<div id="result" style="display:none;margin-top:15px;background:#f0fdfa;padding:12px;border-radius:8px;word-break:break-all;border:1px dashed #0d9488"></div>
<div id="myLinks" style="margin-top:20px"></div>
<button class="btn" style="margin-top:20px;background:#ddd;color:#000" onclick="doLogout()">Logout</button>
</div>
<script>
let currentCat='Toys';
function showLogin(){signupBox.classList.add('hidden');loginBox.classList.remove('hidden');dashBox.classList.add('hidden')}
function showSignup(){loginBox.classList.add('hidden');signupBox.classList.remove('hidden')}
function setCat(el,cat){currentCat=cat;document.querySelectorAll('.cat button').forEach(b=>b.classList.remove('active'));el.classList.add('active');}
function doSignup(){
 let n=sName.value.trim(), e=sEmail.value.trim(), p=sPass.value.trim(), g=sGroup.value.trim();
 if(!n||!e||!p||!g){alert("Sab boxes bharo");return}
 let users=JSON.parse(localStorage.getItem('skate_users')||'[]');
 if(users.find(u=>u.email==e)){alert("Ye Gmail pehle se hai, Login karo");showLogin();return}
 users.push({name:n,email:e,pass:p,group:g}); localStorage.setItem('skate_users',JSON.stringify(users));
 alert("Account Approved! Ab Login karo"); showLogin();
}
function doLogin(){
 let e=lEmail.value.trim(), p=lPass.value.trim();
 let users=JSON.parse(localStorage.getItem('skate_users')||'[]');
 let f=users.find(u=>u.email==e && u.pass==p);
 if(f){localStorage.setItem('skate_current',JSON.stringify(f));openDash(f)}else{lMsg.innerText="Gmail ya Password ghalat hai!"}
}
function openDash(u){
 signupBox.classList.add('hidden');loginBox.classList.add('hidden');dashBox.classList.remove('hidden');
 dName.innerText=u.name; loadStats();
}
function loadStats(){
 let all=JSON.parse(localStorage.getItem('skate_links')||'[]');
 let cur=JSON.parse(localStorage.getItem('skate_current'));
 let mine=all.filter(x=>x.owner==cur.email);
 cProd.innerText=mine.length; cClick.innerText=mine.reduce((s,x)=>s+x.clicks,0); cEarn.innerText='$'+(mine.reduce((s,x)=>s+x.clicks,0)*0.20).toFixed(2);
 let html='<b style="font-size:14px">My Created Links:</b>'; mine.reverse().forEach(m=>{
 html+=`<div style="background:#f8fafc;padding:10px;border-radius:8px;margin-top:8px;font-size:12px"><b>${m.cat}</b> - ${m.clicks} Clicks<br><span style="color:#0d9488">${m.myLink}</span></div>`;
 }); myLinks.innerHTML=html;
}
function makeLink(){
 let link=wLink.value.trim(); if(!link){alert("Link dalo");return}
 let cur=JSON.parse(localStorage.getItem('skate_current'));
 let myLink="https://skatecart.github.io/Skatecart/?ref="+cur.email+"&cat="+currentCat+"&product="+encodeURIComponent(link);
 let all=JSON.parse(localStorage.getItem('skate_links')||'[]');
 all.push({owner:cur.email,cat:currentCat,original:link,myLink:myLink,clicks:Math.floor(Math.random()*50)+5});
 localStorage.setItem('skate_links',JSON.stringify(all));
 result.style.display="block"; result.innerHTML="<b>✅ "+currentCat+" Link Ready:</b><br>"+myLink+"<br><br><button onclick=\"navigator.clipboard.writeText('"+myLink+"')\" style='padding:8px 12px;background:#0d9488;color:#fff;border:none;border-radius:6px'>Copy Link</button>";
 wLink.value=''; loadStats();
}
function doLogout(){localStorage.removeItem('skate_current');showLogin()}
let cur=localStorage.getItem('skate_current'); if(cur){openDash(JSON.parse(cur))}
</script>
</body>
</html>
