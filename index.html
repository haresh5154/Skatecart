<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkateCart</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap');
*{box-sizing:border-box;font-family:Inter,Arial}
body{margin:0;background:#f0faf9}
.hd{padding:12px 16px;background:#fff;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:9;border-bottom:1px solid #e5ecec}
.logo{font-weight:900;font-size:24px;color:#facc15}.logo span{color:#0e7490}
.wrap{max-width:600px;margin:0 auto;padding:10px}
.box{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 6px 20px rgba(0,0,0,.06);border:1px solid #eef2f2}
.inp{width:100%;padding:14px;border:1.5px solid #d1d5db;border-radius:12px;font-size:15px;margin-top:10px;outline:none}
.btn{width:100%;background:linear-gradient(90deg,#0f766e,#14b8a6);color:#fff;border:none;padding:14px;border-radius:12px;font-weight:900;font-size:16px;margin-top:10px;cursor:pointer}
.linkArea{background:#fef9c3;border:2px dashed #facc15;border-radius:12px;padding:12px;margin:8px 0;word-break:break-all;text-align:center;font-weight:800;color:#000}
</style>
<script>
// Visitor Logic -?CODE ya?r= aaye to dashboard kabhi nahi dikhega
(function(){
  let s=location.search; if(!s) return;
  let p=new URLSearchParams(s); let r=p.get('r');
  let q=s.replace('?','').split('&')[0].replace('s=','');
  let isVisitor = r || (q && q.length>=4 && q.length<=10);
  if(!isVisitor) return;
  document.addEventListener('DOMContentLoaded',()=>{
    document.body.innerHTML='<div style="display:flex;min-height:100vh;justify-content:center;align-items:center;flex-direction:column;background:#fff;text-align:center"><div style="font-size:40px">🔒</div><div style="font-weight:900;margin:10px 0">Checking security...</div><div style="color:#888">Redirecting...</div></div>';
    let finalUrl=null;
    if(r){ try{finalUrl=decodeURIComponent(escape(atob(r)));}catch(e){try{finalUrl=atob(r);}catch(e2){}} if(finalUrl){location.replace(finalUrl); return;} }
    try{
      let all=JSON.parse(localStorage.getItem('skate_all_links')||'[]');
      let f=all.find(x=>x.sCode===q);
      if(f){ try{finalUrl=decodeURIComponent(escape(atob(f.encoded)));}catch(e){finalUrl=f.original;} if(finalUrl) location.replace(finalUrl); }
    }catch(e){}
  });
})();
</script>
</head>
<body>
<div class="hd"><div class="logo">Skate <span>Cart</span></div></div>
<div class="wrap">
<div class="box" style="background:#0f172a;color:white;border-radius:20px;display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div style="background:rgba(255,255,255,.1);padding:12px;border-radius:14px"><div style="font-size:10px;color:#5eead4">BALANCE</div><div style="font-weight:900;font-size:18px">$0.50</div></div>
<div style="background:rgba(255,255,255,.1);padding:12px;border-radius:14px"><div style="font-size:10px;color:#5eead4">CLICKS</div><div style="font-weight:900;font-size:18px" id="tClicks">0</div></div>
</div>
<div class="box">
<input id="wLink" class="inp" placeholder="Paste Walmart Link...">
<button id="genBtn" class="btn" onclick="makeLinks()">Generate Earning Link</button>
</div>
<div id="readySec" style="display:none">
<div class="box" style="background:#ecfdf5;text-align:center;border:2px solid #6ee7b7">
<div style="font-weight:900">🎉 Link Ready!</div>
<div class="linkArea" id="shortLink"></div>
<button class="btn" style="background:#000" onclick="copyT('shortLink',this)">Copy Short Link (?CODE)</button>
<div style="font-size:10px;color:#666;margin-top:8px;word-break:break-all" id="longLink"></div>
<button class="btn" style="background:#fff;color:#000;border:1px solid #000;margin-top:8px;font-size:13px" onclick="copyT('longLink',this)">Copy Long Backup (?r=) Link</button>
</div>
</div>
<div class="box"><div style="font-weight:900">🔗 Recent Links</div><div id="recent"></div></div>
</div>
<script>
function genId(){let c="ABCDEFGHJKLMNPQRSTUVWXYZ0123456789",s="";for(let i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
function makeLinks(){
  let o=document.getElementById('wLink').value.trim();
  if(!o){alert("Link paste karo bhai jaan");return;}
  if(!o.startsWith('http')) o='https://'+o;
  let sCode=genId();
  let enc=btoa(unescape(encodeURIComponent(o)));
  let shortL=location.origin+location.pathname+"?"+sCode;
  let longL=location.origin+location.pathname+"?r="+enc;
  let all=JSON.parse(localStorage.getItem('skate_all_links')||'[]');
  all.push({original:o,sCode:sCode,encoded:enc,shortLink:shortL,longLink:longL,date:new Date().toLocaleDateString('en-GB'),clicks:0});
  localStorage.setItem('skate_all_links',JSON.stringify(all));
  document.getElementById('shortLink').innerText=shortL;
  document.getElementById('longLink').innerText=longL;
  document.getElementById('readySec').style.display='block';
  loadR(); document.getElementById('wLink').value="";
}
function loadR(){let all=JSON.parse(localStorage.getItem('skate_all_links')||'[]');let h="";all.reverse().forEach(x=>{h+=`<div style="display:flex;justify-content:space-between;align-items:center;border:1px solid #eee;padding:10px;border-radius:10px;margin-top:8px"><div><div style="font-weight:800;font-size:12px">${x.shortLink}</div><div style="font-size:10px;color:#888">${x.date}</div></div><button onclick="navigator.clipboard.writeText('${x.longLink}')" style="background:#000;color:#fff;border:none;padding:8px 12px;border-radius:8px;font-weight:800">Copy</button></div>`});document.getElementById('recent').innerHTML=h||"<p style='color:#999;text-align:center'>No links</p>";document.getElementById('tClicks').innerText=all.length;}
function copyT(id,btn){navigator.clipboard.writeText(document.getElementById(id).innerText);let o=btn.innerText;btn.innerText="✅ Copied!";setTimeout(()=>btn.innerText=o,1200);}
loadR();
</script>
</body>
</html>
