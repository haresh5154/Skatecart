<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
  // 1. Apni Public Key yahan lagao
  emailjs.init("YOUR_PUBLIC_KEY");

  // 2. Ye function jab bhi Approve karoge toh auto email bhej dega
  function sendCreatorApproval(toEmail, trackingId) {
    const link = `https://skatecart.github.io/Skatecart/?track=${trackingId}&ref=` + btoa(toEmail);
    
    emailjs.send("service_wxtih9l", "YOUR_TEMPLATE_ID", {
      to_email: toEmail,
      tracking_id: trackingId,
      tracking_link: link
    }).then(function() {
      alert("Ho gaya! Email automatic chali gayi Gmail par!");
    });
  }

  // Example - Haresh Kumar ko bhejne ke liye
  // sendCreatorApproval("kavoloy43@gmail.com", "FO68074");
</script>
