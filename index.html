<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkateCart - Walmart Deals Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<header class="bg-blue-600 text-white p-6 text-center">
<h1 class="text-3xl font-bold">🛒 SkateCart</h1>
<p>Walmart Best Deals - Live Updated</p>
</header>
<main class="p-4 max-w-5xl mx-auto">
<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
<div class="bg-white p-4 rounded-xl shadow">
<img src="https://i5.walmartimages.com/seo/Apple-AirPods-2nd-Gen_9a0b0a0a.jpg" class="w-full h-40 object-contain">
<h2 class="font-bold mt-2">Apple AirPods (2nd Gen) - 50% OFF</h2>
<p class="text-green-600 font-bold">$69.00</p>
<a href="https://www.walmart.com/search?q=airpods" target="_blank" class="block bg-blue-600 text-white text-center py-2 rounded mt-2">View on Walmart</a>
</div>
<div class="bg-white p-4 rounded-xl shadow">
<img src="https://i5.walmartimages.com/seo/SAMSUNG-65-Class-QLED-4K-The-Frame_abc.jpg" class="w-full h-40 object-contain">
<h2 class="font-bold mt-2">Samsung 65" QLED TV - Hot Deal</h2>
<p class="text-green-600 font-bold">$599.00</p>
<a href="https://www.walmart.com/search?q=samsung+tv" target="_blank" class="block bg-blue-600 text-white text-center py-2 rounded mt-2">View on Walmart</a>
</div>
<div class="bg-white p-4 rounded-xl shadow">
<img src="https://i5.walmartimages.com/seo/Mainstays-Micromink-Sherpa-Throw_123.jpg" class="w-full h-40 object-contain">
<h2 class="font-bold mt-2">Mainstays Blanket - Only $15</h2>
<p class="text-green-600 font-bold">$15.00</p>
<a href="https://www.walmart.com/search?q=blanket" target="_blank" class="block bg-blue-600 text-white text-center py-2 rounded mt-2">View on Walmart</a>
</div>
</div>
</main>
<footer class="text-center p-4 text-gray-500 text-sm">© 2025 SkateCart - Walmart Deals Hub</footer>
</body>
</html>
