<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skatecart Hub - Deals & Clearance</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
        }
        header {
            background: #0071dc;
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .deals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .deal-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }
        .deal-card:hover {
            transform: translateY(-5px);
        }
        .deal-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #eee;
        }
        .deal-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .deal-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #222;
        }
        .deal-price {
            font-size: 18px;
            font-weight: bold;
            color: #d9534f;
            margin-bottom: 15px;
        }
        .deal-btn {
            margin-top: auto;
            display: block;
            text-align: center;
            background: #ffc220;
            color: #111;
            padding: 10px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        .deal-btn:hover {
            background: #e0aa1b;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 13px;
            margin-top: 40px;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <header>
        <h1>Skatecart Hub</h1>
        <p>Best Clearance Deals & Daily Finds</p>
    </header>

    <div class="container">
        <div class="deals-grid" id="productsContainer">
            <!-- Product 1 -->
            <div class="deal-card">
                <img src="https://via.placeholder.com/300x200" alt="Product Image" class="deal-img">
                <div class="deal-content">
                    <div class="deal-title">Yahan Apne Product Ka Naam Likhein</div>
                    <div class="deal-price">$19.99 <span style="text-decoration: line-through; color: #999; font-size: 14px;">$49.99</span></div>
                    <!-- Yahan apna Walmart ya Affiliate link lagayein -->
                    <a href="YOUR_WALMART_AFFILIATE_LINK_HERE" target="_blank" class="deal-btn">Grab Deal at Walmart</a>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="deal-card">
                <img src="https://via.placeholder.com/300x200" alt="Product Image" class="deal-img">
                <div class="deal-content">
                    <div class="deal-title">Dusra Product Ka Naam</div>
                    <div class="deal-price">$9.99</div>
                    <a href="YOUR_WALMART_AFFILIATE_LINK_HERE" target="_blank" class="deal-btn">Grab Deal at Walmart</a>
                </div>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Skatecart Hub. All rights reserved.
    </footer>

</body>
</html>
