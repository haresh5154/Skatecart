<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creator Hub - Walmart Style</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f1f5f9;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
.card{background:#fff;width:100%;max-width:480px;border-radius:22px;padding:28px;box-shadow:0 10px 40px rgba(0,0,0,.08)}
.tabs{display:flex;background:#eef2f7;border-radius:12px;padding:4px;margin:16px 0}
.tab{flex:1;padding:11px;text-align:center;border-radius:10px;font-weight:800;cursor:pointer;color:#64748b}
.tab.active{background:#fff;color:#111;box-shadow:0 2px 8px rgba(0,0,0,.08)}
label{font-size:13px;font-weight:600;margin:10px 0 4px;display:block}
input{width:100%;padding:12px;border:1.5px solid #e2e8f0;border-radius:10px}
.btn{width:100%;background:#0e8a8a;color:#fff;border:0;padding:13px;border-radius:12px;font-weight:800;margin-top:14px;cursor:pointer}
.hide{display:none!important}
</style></head><body>

<div class="card" id="auth">
<h2 style="text-align:center">🛒 CREATOR HUB</h2>
<h1 id="h1">Welcome back</h1>
<p style="color:#64748b;font-size:13px;margin-bottom:12px">Sign in to your account</p>
<div class="tabs">
<div id="t1" class="tab active" onclick="openLogin()">Sign In</div>
<div id="t2" class="tab" onclick="openReg()">New Creator Register</div>
</div>

<div id="login">
<label>Email</label><input id="LE" placeholder="Email">
<label>Password</label><input id="LP" type="password" placeholder="Password">
<button class="btn" onclick="loginNow()">Sign in</button>
<p style="text-align:center;margin-top:10px;font-size:13px;color:#64748b">New here? <span style="color:#0e8a8a;font-weight:800;cursor:pointer" onclick="openReg()">Create account</span></p>
</div>

<div id="reg" class="hide">
<label>First Name</label><input id="FN" placeholder="John"><label>Last Name</label><input id="LN" placeholder="Doe">
<label>Email (Gmail)</label><input id="RE" placeholder="you@gmail.com">
<label>Password</label><input id="RP" type="password" placeholder="Create password">

<label style="color:#0e8a8a;margin-top:14px">🔗 Facebook Verification for Approval</label>
<label>Facebook Group Link</label><input id="FG" placeholder="https://facebook.com/groups/...">
<label>Facebook Page Link</label><input id="FP" placeholder="https://facebook.com/yourpage">

<button class="btn" onclick="regNow()">Submit for Approval</button>
<p style="text-align:center;margin-top:10px;font-size:13px;color:#64748b">Already have? <span style="color:#0e8a8a;font-weight:800;cursor:pointer" onclick="openLogin()">Sign in</span></p>
</div>
</div>

<div class="card hide" id="dash">
<h1>Approved ✅</h1><p id="uinfo" style="color:#64748b;margin:8px 0"></p>
<div style="background:#f0fdfa;border:1px solid #99f6e0;padding:12px;border-radius:12px">
<b style="color:#0e8a8a">Your Walmart Tracking Link (Active)</b>
<input id="link" readonly style="margin-top:8px">
<button class="btn" style="background:#111" onclick="navigator.clipboard.writeText(document.getElementById('link').value);alert('Link Copied!')">Copy Link</button>
<p id="fbinfo" style="color:#64748b;font-weight:600;margin-top:8px;font-size:12px"></p>
<p style="color:#0e8a8a;font-weight:700;margin-top:6px;font-size:13px">Approval Email aapki Gmail par bhej diya gaya hai 📩</p>
</div>
<button class="btn" style="background:#fff;color:#111;border:1.5px solid #e2e8f0" onclick="localStorage.removeItem('cur');location.reload()">Logout</button>
</div>

<script>
let track = new URLSearchParams(location.search).get('track') || 'FO68074';
function openLogin(){login.classList.remove('hide');reg.classList.add('hide');t1.classList.add('active');t2.classList.remove('active');h1.innerText='Welcome back';}
function openReg(){reg.classList.remove('hide');login.classList.add('hide');t2.classList.add('active');t1.classList.remove('active');h1.innerText='New Creator Register';}
function regNow(){
if(!FN.value||!RE.value||!FG.value||!FP.value){alert('Please Facebook Group aur Page link dono dalo');return}
if(!FG.value.includes('facebook.com')||!FP.value.includes('facebook.com')){alert('Sahi Facebook Link dalo');return}
let u={f:FN.value,l:LN.value,e:RE.value,p:btoa(RP.value),fb:{g:FG.value,p:FP.value,status:'Approved'},track:track};
localStorage.setItem('cr_'+u.e,JSON.stringify(u));
localStorage.setItem('cur',u.e);

// Gmail Auto Notification - Automatic Email Trigger
let subject = encodeURIComponent("Walmart Creator Hub - Approved ✅");
let body = encodeURIComponent(`Hello ${u.f} ${u.l},\n\nCongratulations! Aapka Walmart Creator Hub account Approved ho gaya hai.\n\nFacebook Group: ${u.fb.g}\nFacebook Page: ${u.fb.p}\nTracking ID: ${track.toUpperCase()}\n\nAapka Tracking Link: ${location.origin+location.pathname}?track=${track.toUpperCase()}&ref=${btoa(u.e)}\n\nAb aap Walmart ka kaam start kar sakte hain.\n\nThanks,\nCreator Hub Team`);
window.open(`mailto:${u.e}?subject=${subject}&body=${body}`, '_blank');

showDash();
}
function loginNow(){let d=localStorage.getItem('cr_'+LE.value);if(!d){alert('No account, Register karo');openReg();return}if(JSON.parse(d).p!==btoa(LP.value)){alert('Wrong password');return}localStorage.setItem('cur',LE.value);showDash()}
function showDash(){let c=localStorage.getItem('cur');let u=JSON.parse(localStorage.getItem('cr_'+c));auth.classList.add('hide');dash.classList.remove('hide');uinfo.innerText=u.f+' '+u.l+' ('+u.e+') | Track:'+track.toUpperCase();fbinfo.innerText='Group: '+u.fb.g+' | Page: '+u.fb.p;link.value=location.origin+location.pathname+'?track='+track.toUpperCase()+'&ref='+btoa(u.e)}
if(localStorage.getItem('cur')){showDash()}
</script>
</body></html>
