<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkateCart - Pro</title><style>body{margin:0;font-family:Arial;background:#f6fafa}.header{display:flex;justify-content:space-between;padding:14px 20px;background:#fff;border-bottom:1px solid #eee;position:sticky;top:0}.logo{font-weight:800;font-size:22px;color:#0d9488}.card{background:#fff;border-radius:16px;padding:18px;margin:14px auto;max-width:500px;width:92%;box-shadow:0 4px 15px rgba(0,0,0,.06)}.input{width:100%;padding:13px;border:1.5px solid #dbe6e6;border-radius:10px;margin:7px 0}.btn{width:100%;background:#14b8a6;color:#fff;border:none;padding:13px;border-radius:10px;font-weight:800;font-size:16px}.linkBox{background:#f8fafa;padding:12px;border-radius:12px;margin-top:10px;font-size:13px;word-break:break-all;border:1px solid #e5ecec}</style></head><body>
<div class="header"><div class="logo">SkateCart</div><div style="font-size:12px">germant786kk@gmail.com</div></div>
<div class="card"><h2 style="text-align:center">Walmart / Amazon Link</h2><input id="wLink" class="input" placeholder="Product link yahan paste karo"><button class="btn" onclick="makeLinks()">Generate BOTH Links</button></div>
<div class="card" id="resultBox" style="display:none"><b>✅ Links Ready:</b>
<div class="linkBox"><b>1. Badi Link:</b><br><span id="bigLink" style="color:#0d9488"></span><br><button onclick="copyT('bigLink')" style="margin-top:6px;background:#0d9488;color:#fff;border:none;padding:6px 10px;border-radius:6px">Copy Badi</button></div>
<div class="linkBox"><b>2. Choti Link (ZyLike jaisi):</b><br><span id="shortLink" style="color:#d11;font-weight:800;font-size:15px"></span><br><button onclick="copyT('shortLink')" style="margin-top:6px;background:#111;color:#fff;border:none;padding:6px 10px;border-radius:6px">Copy Choti</button></div></div>
<div class="card"><b>Recent Links - Clicks / Earning</b><div id="recent"></div><p style="margin-top:10px">Total Clicks: <b id="clicks">0</b> | Total Earn: <b id="earn">$0.00</b></p></div>
<script>
(function(){let p=new URLSearchParams(window.location.search);let s=p.get('s');let r=p.get('ref');let u=p.get('url');let all=JSON.parse(localStorage.getItem('skate_all_links')||'[]');if(s){let f=all.find(x=>x.shortId===s);if(f){f.clicks=(f.clicks||0)+1;localStorage.setItem('skate_all_links',JSON.stringify(all));window.location.href=f.original;return;}}if(r&&u){let d=decodeURIComponent(u);let f=all.find(x=>x.original===d);if(f){f.clicks=(f.clicks||0)+1;localStorage.setItem('skate_all_links',JSON.stringify(all));}window.location.href=d;}})();
let cur=JSON.parse(localStorage.getItem('skate_current')||'{"email":"germant786kk@gmail.com"}');
function genID(){return Math.random().toString(36).substring(2,12).toUpperCase();}
function makeLinks(){let o=document.getElementById('wLink').value.trim();if(!o){alert("Link dalo");return}let sid=genID();let big=location.origin+location.pathname+"?ref="+cur.email+"&url="+encodeURIComponent(o);let short=location.origin+location.pathname+"?s="+sid;let all=JSON.parse(localStorage.getItem('skate_all_links')||'[]');all.push({shortId:sid,original:o,bigLink:big,shortLink:short,owner:cur.email,clicks:0,date:new Date().toLocaleDateString()});localStorage.setItem('skate_all_links',JSON.stringify(all));document.getElementById('bigLink').innerText=big;document.getElementById('shortLink').innerText=short;document.getElementById('resultBox').style.display='block';loadR();alert("✅ Dono links ban gayi!");}
function loadR(){let all=JSON.parse(localStorage.getItem('skate_all_links')||'[]');let mine=all.filter(x=>x.owner===cur.email);let clicks=mine.reduce((s,x)=>s+x.clicks,0);document.getElementById('clicks').innerText=clicks;document.getElementById('earn').innerText="$"+(clicks*0.25).toFixed(2);let html="";mine.slice().reverse().forEach(m=>{html+=`<div class="linkBox" style="background:#fff;border:1.5px solid #14b8a6"><b>✅ ${m.date} - ${m.clicks} clicks</b><div style="margin-top:8px"><b>1. Badi Link:</b><br><span style="color:#0d9488;font-size:11px">${m.bigLink}</span></div><div style="margin-top:8px"><b>2. Choti Link (ZyLike jaisi):</b><br><span style="color:#d11;font-weight:800">${m.shortLink}</span></div></div>`;});document.getElementById('recent').innerHTML=html||"No links";}
function copyT(id){let t=document.getElementById(id).innerText;navigator.clipboard.writeText(t);alert("Copied!");}loadR();
</script></body></html>
