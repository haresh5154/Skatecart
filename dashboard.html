<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Skatecart - Admin Approval</title><style>body{margin:0;font-family:sans-serif;background:#f1f5f9}.side{width:250px;background:#0f172a;color:#fff;position:fixed;height:100vh;padding:20px}.main{margin-left:290px;padding:20px}.card{background:#fff;padding:20px;border-radius:15px;margin-bottom:20px;box-shadow:0 4px 10px rgba(0,0,0,0.05)}.kpi{display:flex;gap:15px;flex-wrap:wrap}.kpi div{flex:1;min-width:120px;background:#fff;padding:15px;border-radius:12px;text-align:center;border-left:5px solid #0f172a}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}.approve{background:#16a34a;color:#fff;border:none;padding:8px 15px;border-radius:20px;cursor:pointer}.pending{background:#f59e0b;color:#fff;padding:5px 10px;border-radius:20px;font-size:12px}@media(max-width:700px){.side{display:none}.main{margin-left:0}}</style></head><body><div class="side"><h2>Skatecart</h2><p>Admin Panel</p><br><b>Wallet Control</b><br><br>Earning pehle mere paas</div><div class="main"><h2>Admin Earning Approval</h2><div class="kpi"><div><h3 id="total">Rs 0</h3><p>Total Mere Paas</p></div><div><h3 id="pend">Rs 0</h3><p>Pending Approval</p></div><div><h3 id="paid">Rs 0</h3><p>Paid to Users</p></div></div><div class="card"><h3>Requests - Aap Approve Karoge Tabhi Paisa Jayega</h3><table id="tbl"><tr><th>Order ID</th><th>User</th><th>Amount</th><th>Status</th><th>Action</th></tr></table></div></div><script>let orders=[{id:"ORD-101",user:"Rider Ali",amount:500,status:"Pending"},{id:"ORD-102",user:"Seller Zain",amount:1200,status:"Pending"},];function load(){let total=0,pend=0;let tbl=document.getElementById("tbl");tbl.innerHTML='<tr><th>Order ID</th><th>User</th><th>Amount</th><th>Status</th><th>Action</th></tr>';orders.forEach(o=>{total+=o.amount;if(o.status=="Pending")pend+=o.amount;tbl.innerHTML+=`<tr><td>${o.id}</td><td>${o.user}</td><td>Rs ${o.amount}</td><td><span class="pending">${o.status}</span></td><td><button class="approve" onclick="approve('${o.id}')">Approve & Send</button></td></tr>`;});document.getElementById("total").innerText="Rs "+total;document.getElementById("pend").innerText="Rs "+pend;}window.approve=(id)=>{let o=orders.find(x=>x.id==id);if(confirm(o.user+" ko Rs "+o.amount+" bhejna hai?")){o.status="Paid";alert("Done! Rs "+o.amount+" bhej diya");load();}};load();</script></body></html>
