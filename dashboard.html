<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard - Skatecart</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<style>
body{margin:0;font-family:sans-serif;background:#f1f5f9}
.s{width:220px;background:#0f172a;color:white;position:fixed;height:100vh;padding:20px}
.m{margin-left:260px;padding:25px}
.c{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{padding:12px;text-align:left;border-bottom:1px solid #e2e8f0}
.b{background:#dcfce7;color:#16a34a;padding:6px 12px;border-radius:20px;font-size:12px}
.b2{background:#fee2e2;color:#dc2626;padding:6px 12px;border-radius:20px;font-size:12px}
button{padding:10px 16px;border:none;border-radius:8px;background:#0f172a;color:white;cursor:pointer}
</style>
</head>
<body>
<div class="s"><h3>Skatecart</h3><p>Dashboard</p><br><button onclick="loadOrders()">Orders Reload</button></div>
<div class="m">
<div class="c">
<h2>Orders Dashboard</h2>
<p>Firebase Live Data</p>
<table id="ordersTable">
<tr><th>Order ID</th><th>Customer</th><th>Amount</th><th>Status</th></tr>
</table>
</div>
</div>

<script>
// --- Yahan apna Firebase Config dalo ---
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function loadOrders(){
  db.collection("orders").onSnapshot((snapshot)=>{
    let table = document.getElementById("ordersTable");
    table.innerHTML = "<tr><th>Order ID</th><th>Customer</th><th>Amount</th><th>Status</th></tr>";
    snapshot.forEach(doc=>{
      let d = doc.data();
      table.innerHTML += `<tr><td>${doc.id}</td><td>${d.customer || 'N/A'}</td><td>Rs ${d.amount || 0}</td><td><span class="b">${d.status || 'Pending'}</span></td></tr>`;
    });
  });
}
loadOrders();
</script>
</body>
</html>
